<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>App Navigation Icons Preview</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #f6f7f8; padding: 32px; color: #222; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
  .card h3 { margin: 0 0 14px; font-size: 16px; }
  .row { display: flex; justify-content: space-around; gap: 12px; }
  .icon-box { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; border-radius: 8px; background: #fafafa; min-width: 72px; }
  .icon-box svg { width: 32px; height: 32px; }
  .icon-box span { font-size: 12px; color: #666; }
</style>
</head>
